[project]
name = "comunidades"
version = "0.1.0"
description = "Desafio 3: identifica as comunidades afetadas por desligamento programado (Leopoldina/MG)"
authors = [
    { name = "Luciano Filho", email = "lcn.filho1@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.2",
    "defusedxml>=0.7.1",
    "fastapi>=0.143.0",
    "folium>=0.20.0",
    "fpdf2>=2.8.9",
    "geopandas>=1.2.0",
    "httpx>=0.28.1",
    "lameenc>=1.8.4",
    "networkx>=3.7",
    "openpyxl>=3.1.5",
    "osmnx>=2.1.1",
    "pandas>=3.0.6",
    "piper-tts>=1.8.0",
    "psycopg[binary]>=3.2",
    "pyogrio>=0.13.0",
    "python-multipart>=0.0.32",
    "rapidfuzz>=3.14.6",
    "scikit-learn>=1.9.1",
    "shapely>=2.1.2",
    "unidecode>=1.4.0",
    "uvicorn>=0.30",
]

[project.scripts]
comunidades = "comunidades:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "coverage>=7.16.2",
    "hypothesis>=6.169.0",
]
