# Render (Blueprint): o serviço web do Farol a partir do Dockerfile, com deploy a cada push na master.
# O banco (Postgres com PostGIS) fica fora daqui: a conexão vai em DATABASE_URL, cadastrada no painel
# do Render como segredo (nunca no git). Carga dos dados públicos: ver DEPLOY.md.
services:
  - type: web
    name: farol
    runtime: docker
    plan: free
    region: virginia            # a região do Render mais perto do Brasil
    branch: master
    autoDeploy: true
    healthCheckPath: /api/saude
    envVars:
      - key: DATABASE_URL
        sync: false             # segredo: o Render pede o valor ao criar o serviço
      - key: FAROL_PRODUCAO
        value: "1"
      - key: FAROL_AUDIO          # sem a voz: o plano gratuito tem 512 MB e a voz pede ~520 MB a mais
        value: "0"
      - key: FAROL_CHAVE_PACOTE   # HMAC do pacote da conferência da planilha (o Render gera; nunca no git)
        generateValue: true
      - key: FAROL_CHAVE_ARQUIVOS # AES-256-GCM dos PDF e MP3 enviados às rádios (o Render gera; nunca no git)
        generateValue: true
      - key: FAROL_URL_PUBLICA    # endereço público do Farol (o link "Confirmar recebimento" do e-mail)
        sync: false
      - key: FAROL_SMTP_HOST      # servidor de e-mail; sem ele, o envio por e-mail fica desligado
        sync: false
      - key: FAROL_SMTP_PORTA
        sync: false
      - key: FAROL_SMTP_USUARIO
        sync: false
      - key: FAROL_SMTP_SENHA     # segredo: só no painel do Render
        sync: false
      - key: FAROL_SMTP_REMETENTE
        sync: false
