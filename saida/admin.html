<style>
/* ---------- Cores do Norte (claro e escuro, como no mapa) ---------- */
:root {
  color-scheme: light;
  --ambar: #F5B83D; --noite: #0E1620; --mare: #1C2A37; --nevoa: #E9EEF3;
  --fundo: #F3F5F7; --sup: #FFFFFF; --sup2: #EDF1F4; --linha: #D5DDE4;
  --texto: #12202C; --texto2: #3E4C59; --apagado: #5A6875;
  --erro: #B42318; --ok: #1B7D4B; --info: #1663C7; --sombra: 0 2px 10px rgba(14,22,32,.12);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --fundo: #0E1620; --sup: #15202B; --sup2: #1C2A37; --linha: #2A3A4A;
    --texto: #E9EEF3; --texto2: #B4C0CC; --apagado: #93A1AF;
    --erro: #FF8A7A; --ok: #3FB97A; --info: #6CB4FF; --sombra: 0 2px 12px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --fundo: #0E1620; --sup: #15202B; --sup2: #1C2A37; --linha: #2A3A4A;
  --texto: #E9EEF3; --texto2: #B4C0CC; --apagado: #93A1AF;
  --erro: #FF8A7A; --ok: #3FB97A; --info: #6CB4FF; --sombra: 0 2px 12px rgba(0,0,0,.45);
}

/* ---------- Base ---------- */
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--fundo); color: var(--texto);
  font: 15px/1.5 "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
.mono { font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace; font-weight: 500; }
[hidden] { display: none !important; }
a { color: var(--info); }
:focus-visible { outline: 2px solid var(--info); outline-offset: 2px; }

/* Faixa de protótipo: sempre visível, no topo */
.faixa { position: sticky; top: 0; z-index: 50; margin: 0; padding: 10px 16px; background: var(--ambar); color: var(--noite);
  font-size: 14px; font-weight: 600; line-height: 1.4; text-align: center; }

.topo { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding: 10px 16px; background: var(--noite); color: var(--nevoa); }
.marca { display: flex; align-items: center; gap: 10px; min-width: 0; }
.marca svg { width: 40px; height: 40px; flex: none; }
.marca .nome { margin: 0; font-size: 20px; font-weight: 600; line-height: 1.1; }
.marca .sub { margin: 0; font-size: 13px; color: #B4C0CC; }
.acoes-topo { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.sessao { font-size: 13px; color: #B4C0CC; }
.topo button, .topo a.botao { min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid #2A3A4A;
  background: var(--mare); color: var(--nevoa); font: inherit; font-size: 14px; cursor: pointer; text-decoration: none;
  display: inline-flex; align-items: center; }

/* Corpo: menu lateral simples + conteúdo */
.corpo { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: calc(100vh - 140px); }
.corpo:has(> nav.menu[hidden]) { grid-template-columns: minmax(0, 1fr); }
td.mono { white-space: nowrap; }
nav.menu { padding: 16px 10px; border-right: 1px solid var(--linha); background: var(--sup); }
nav.menu ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
nav.menu a { display: flex; align-items: center; min-height: 44px; padding: 0 12px; border-radius: 10px;
  color: var(--texto); text-decoration: none; font-weight: 500; }
nav.menu a[aria-current="page"] { background: var(--sup2); box-shadow: inset 3px 0 0 var(--ambar); }
nav.menu a:hover { background: var(--sup2); }
main { padding: 24px; max-width: 1100px; width: 100%; }
h1 { margin: 0 0 6px; font-size: 24px; font-weight: 600; }
h2 { margin: 0 0 10px; font-size: 18px; font-weight: 600; }
.apoio { margin: 0 0 18px; color: var(--texto2); }
.cartao { background: var(--sup); border: 1px solid var(--linha); border-radius: 14px; padding: 18px; margin-bottom: 16px; }

/* Botões */
.botao, button.botao { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; min-width: 44px;
  padding: 0 16px; border-radius: 10px; border: 1px solid var(--linha); background: var(--sup2); color: var(--texto);
  font: inherit; font-weight: 500; cursor: pointer; text-decoration: none; }
.botao.principal { background: var(--ambar); border-color: var(--ambar); color: var(--noite); font-weight: 600; }
.botao.perigo { color: var(--erro); }
.botao:hover { filter: brightness(1.04); }
.botao:disabled { opacity: .55; cursor: not-allowed; }
.linha-botoes { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* Mensagens */
.aviso { margin: 0 0 16px; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--linha); background: var(--sup2); }
.aviso.ok { border-color: var(--ok); }
.aviso.erro { border-color: var(--erro); color: var(--erro); }
.aviso p { margin: 0; }
.aviso p + p { margin-top: 4px; }

/* Barra de busca */
.barra { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; margin-bottom: 14px; }
.barra .campo { flex: 1 1 240px; margin: 0; }

/* Formulários */
form { display: block; }
details.grupo { background: var(--sup); border: 1px solid var(--linha); border-radius: 14px; margin-bottom: 12px; }
details.grupo > summary { display: flex; align-items: center; min-height: 48px; padding: 0 16px; font-weight: 600; cursor: pointer; }
details.grupo > summary .contagem { margin-left: auto; font-size: 13px; color: var(--erro); font-weight: 500; }
.grupo-corpo { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 4px 16px; padding: 4px 16px 16px; }

.municipio .erro-campo { grid-column: 1 / -1; }

.tabela-caixa { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; background: var(--sup); border: 1px solid var(--linha); border-radius: 14px; }
th, td { padding: 10px 12px; text-align: left; vertical-align: middle; border-bottom: 1px solid var(--linha); }
th { font-size: 13px; color: var(--texto2); font-weight: 600; background: var(--sup2); }
tr:last-child td { border-bottom: 0; }
td .linha-botoes { flex-wrap: nowrap; }
.etiqueta { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; background: var(--sup2); border: 1px solid var(--linha); }
.etiqueta.ativa, .etiqueta.ativo { color: var(--ok); border-color: var(--ok); }
.etiqueta.suspensa, .etiqueta.bloqueado { color: var(--erro); border-color: var(--erro); }
.vazio { color: var(--texto2); }
.resumo { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; margin: 0; }
.resumo dt { color: var(--texto2); }
.resumo dd { margin: 0; }

/* Entrada (simulada) */
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
legend { padding: 0; margin-bottom: 8px; }
.perfis { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin-bottom: 14px; }
.perfis .opcao { align-items: start; padding: 12px; min-height: 64px; }
.perfis .opcao .caixa { border-radius: 50%; margin-top: 2px; }

.perfis .opcao strong { display: block; }

@media (max-width: 760px) {

  nav.menu { border-right: 0; border-bottom: 1px solid var(--linha); padding: 8px; }

  td .etiqueta { justify-self: start; }
  td .linha-botoes { flex-wrap: wrap; }
}

<script>// =====================================================================================
// MODEL da área administrativa (PROTÓTIPO): estado e regras puras de empresas e usuários.
// Não toca no HTML: recebe valores e devolve valores. O mesmo arquivo vai embutido em
// saida/admin.html (admin.py) e é testado no Node (testes/admin/teste_modelo.mjs).
// Não é controle de acesso real: tudo roda na memória do navegador (ver SEGURANCA.md).
// =====================================================================================
const Modelo = (() => {
  'use strict';

  // ---------- Perfis e permissões ----------
  const PERFIS = {
    admin_farol: 'Admin do Norte',
    admin_empresa: 'Admin da empresa',
    operador: 'Operador',
    consulta: 'Consulta',
  };
  // Perfis que um usuário de empresa pode ter (o Admin do Norte não pertence a empresa)
  const PERFIS_USUARIO = ['admin_empresa', 'operador', 'consulta'];
  const TIPOS_EMPRESA = { distribuidora: 'Distribuidora', cooperativa: 'Cooperativa', permissionaria: 'Permissionária' };
  const IDIOMAS = { 'pt-BR': 'Português (Brasil)', en: 'English', es: 'Español' };
  const FUSOS = ['America/Sao_Paulo', 'America/Bahia', 'America/Fortaleza', 'America/Recife', 'America/Belem',
    'America/Araguaina', 'America/Maceio', 'America/Cuiaba', 'America/Campo_Grande', 'America/Manaus',
    'America/Porto_Velho', 'America/Boa_Vista', 'America/Rio_Branco', 'America/Noronha'];
  const PRAZO_LEGAL_MIN_HORAS = 72;  // REN ANEEL 1.000/2021, art. 436: a antecedência não pode ser menor

  // Código IBGE de cada UF (os 2 primeiros dígitos do código do município)
  const UFS = { RO: '11', AC: '12', AM: '13', RR: '14', PA: '15', AP: '16', TO: '17', MA: '21', PI: '22',
    CE: '23', RN: '24', PB: '25', PE: '26', AL: '27', SE: '28', BA: '29', MG: '31', ES: '32', RJ: '33',
    SP: '35', PR: '41', SC: '42', RS: '43', MS: '50', MT: '51', GO: '52', DF: '53' };

  // ---------- Validações ----------
  const so = (s, re) => String(s ?? '').toUpperCase().replace(re, '');
  const vazio = s => !String(s ?? '').trim();

  // CNPJ numérico e alfanumérico (Receita Federal, a partir de julho de 2026): 12 caracteres
  // [0-9A-Z] e 2 dígitos verificadores numéricos. Valor de cada caractere = código ASCII - 48.
  function normalizarCNPJ(s) { return so(s, /[.\/\-\s]/g); }
  function cnpjValido(s) {
    const c = normalizarCNPJ(s);
    if (!/^[0-9A-Z]{12}[0-9]{2}$/.test(c) || /^(.)\1{13}$/.test(c)) return false;
    const dv = (base, pesos) => {
      const soma = [...base].reduce((t, ch, i) => t + (ch.charCodeAt(0) - 48) * pesos[i], 0);
      const r = soma % 11;
      return r < 2 ? 0 : 11 - r;
    };
    const d1 = dv(c.slice(0, 12), [5, 4, 3, 2, 9, 8, 7, 6, 5, 4, 3, 2]);
    const d2 = dv(c.slice(0, 12) + d1, [6, 5, 4, 3, 2, 9, 8, 7, 6, 5, 4, 3, 2]);
    return c.slice(12) === `${d1}${d2}`;
  }
  function formatarCNPJ(s) {
    const c = normalizarCNPJ(s);
    return c.length === 14 ? `${c.slice(0, 2)}.${c.slice(2, 5)}.${c.slice(5, 8)}/${c.slice(8, 12)}-${c.slice(12)}` : String(s ?? '');
  }

  // Código IBGE de município: 7 dígitos, prefixo da UF e dígito verificador (pesos 1,2,1,2,1,2;
  // soma dos algarismos dos produtos). Alguns municípios têm DV fora da regra: lista do IBGE.
  const IBGE_FORA_DA_REGRA = new Set(['2201919', '2201988', '2202251', '2611533', '3117836', '3152131',
    '4305871', '5203939', '5203962']);
  function ibgeValido(codigo, uf) {
    const c = String(codigo ?? '').trim();
    if (!/^\d{7}$/.test(c)) return false;
    if (uf && UFS[uf] !== c.slice(0, 2)) return false;
    if (!Object.values(UFS).includes(c.slice(0, 2))) return false;
    if (IBGE_FORA_DA_REGRA.has(c)) return true;
    const soma = [...c.slice(0, 6)].reduce((t, d, i) => {
      const p = Number(d) * (i % 2 ? 2 : 1);
      return t + Math.floor(p / 10) + (p % 10);
    }, 0);
    return (10 - (soma % 10)) % 10 === Number(c[6]);
  }

  const RE_DOMINIO = /^(?=.{4,253}$)([a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$/;
  const RE_EMAIL = /^[a-z0-9._%+-]+@([a-z0-9-]+\.)+[a-z]{2,63}$/;
  const dominioValido = d => RE_DOMINIO.test(String(d ?? '').trim().toLowerCase());
  const emailValido = e => RE_EMAIL.test(String(e ?? '').trim().toLowerCase()) && String(e).length <= 254;
  const emailNoDominio = (e, d) => emailValido(e) && String(e).trim().toLowerCase().endsWith('@' + String(d).trim().toLowerCase());
  // Telefone de atendimento: 0800 (11 dígitos) ou fixo/celular com DDD (10 ou 11 dígitos)
  function telefoneValido(t) {
    const d = String(t ?? '').replace(/\D/g, '');
    return /^0800\d{7}$/.test(d) || /^[1-9][1-9]\d{8,9}$/.test(d);
  }
  const siteValido = s => vazio(s) || /^https:\/\/([a-z0-9-]+\.)+[a-z]{2,63}(\/[^\s]*)?$/i.test(String(s).trim());
  const dataValida = s => /^\d{4}-\d{2}-\d{2}$/.test(s ?? '') && !Number.isNaN(Date.parse(s + 'T00:00:00Z'));

  // ---------- Empresa ----------
  function empresaVazia() {
    return {
      id: '', razaoSocial: '', nomeFantasia: '', cnpj: '', tipo: 'distribuidora',
      emailInstitucional: '', telefone: '', site: '',
      gestorNome: '', gestorEmail: '', dpoNome: '', dpoEmail: '',
      pais: 'Brasil', uf: 'MG', municipios: [],
      idioma: 'pt-BR', fuso: 'America/Sao_Paulo', antecedenciaHoras: PRAZO_LEGAL_MIN_HORAS, motivoPadrao: '',
      status: 'ativa', contratoInicio: '', contratoFim: '', dominio: '', exige2Etapas: true,
      criadoPor: '', criadoEm: '', alteradoPor: '', alteradoEm: '',
    };
  }

  // Devolve { campo: mensagem } (vazio = válida). empresas: as demais, para conferir duplicidade.
  function validarEmpresa(e, empresas = []) {
    const erros = {};
    const outras = empresas.filter(o => o.id !== e.id);
    if (vazio(e.razaoSocial)) erros.razaoSocial = 'Informe a razão social.';
    if (vazio(e.nomeFantasia)) erros.nomeFantasia = 'Informe o nome fantasia (é o que aparece nas mensagens).';
    else if (e.nomeFantasia.trim().length > 80) erros.nomeFantasia = 'Use no máximo 80 caracteres.';
    if (vazio(e.cnpj)) erros.cnpj = 'Informe o CNPJ.';
    else if (!cnpjValido(e.cnpj)) erros.cnpj = 'CNPJ inválido: confira os dígitos verificadores.';
    else if (outras.some(o => normalizarCNPJ(o.cnpj) === normalizarCNPJ(e.cnpj))) erros.cnpj = 'Já existe uma empresa com este CNPJ.';
    if (!TIPOS_EMPRESA[e.tipo]) erros.tipo = 'Escolha o tipo.';
    if (vazio(e.emailInstitucional)) erros.emailInstitucional = 'Informe o e-mail institucional.';
    else if (!emailValido(e.emailInstitucional)) erros.emailInstitucional = 'E-mail inválido.';
    if (vazio(e.telefone)) erros.telefone = 'Informe o telefone de atendimento.';
    else if (!telefoneValido(e.telefone)) erros.telefone = 'Use um 0800 (0800 000 0000) ou um número com DDD.';
    if (!siteValido(e.site)) erros.site = 'O site deve começar com https://';
    if (vazio(e.gestorNome)) erros.gestorNome = 'Informe o gestor do contrato.';
    if (vazio(e.gestorEmail)) erros.gestorEmail = 'Informe o e-mail do gestor.';
    else if (!emailValido(e.gestorEmail)) erros.gestorEmail = 'E-mail inválido.';
    if (vazio(e.dpoNome)) erros.dpoNome = 'Informe o encarregado de dados (DPO), exigido pela LGPD.';
    if (vazio(e.dpoEmail)) erros.dpoEmail = 'Informe o e-mail do encarregado de dados.';
    else if (!emailValido(e.dpoEmail)) erros.dpoEmail = 'E-mail inválido.';
    if (!UFS[e.uf]) erros.uf = 'Escolha a UF.';
    if (!e.municipios.length) erros.municipios = 'Inclua pelo menos um município atendido.';
    const vistos = new Set();
    e.municipios.forEach((m, i) => {
      if (vazio(m.nome)) erros[`municipio${i}`] = 'Informe o nome do município.';
      else if (!ibgeValido(m.codigo, e.uf)) erros[`municipio${i}`] = `Código IBGE inválido para ${e.uf}: 7 dígitos, começando por ${UFS[e.uf] ?? '??'}, com dígito verificador correto.`;
      else if (vistos.has(m.codigo)) erros[`municipio${i}`] = 'Município repetido.';
      vistos.add(m.codigo);
    });
    if (!IDIOMAS[e.idioma]) erros.idioma = 'Escolha o idioma.';
    if (!FUSOS.includes(e.fuso)) erros.fuso = 'Escolha o fuso horário.';
    const h = Number(e.antecedenciaHoras);
    if (!Number.isInteger(h) || h < PRAZO_LEGAL_MIN_HORAS || h > 24 * 60)
      erros.antecedenciaHoras = `A antecedência mínima deve ser um número inteiro de horas, de ${PRAZO_LEGAL_MIN_HORAS} (prazo legal) a 1440.`;
    if (String(e.motivoPadrao ?? '').length > 120) erros.motivoPadrao = 'Use no máximo 120 caracteres.';
    if (!['ativa', 'suspensa'].includes(e.status)) erros.status = 'Escolha o status.';
    if (!dataValida(e.contratoInicio)) erros.contratoInicio = 'Informe o início do contrato.';
    if (!dataValida(e.contratoFim)) erros.contratoFim = 'Informe o fim do contrato.';
    else if (dataValida(e.contratoInicio) && e.contratoFim < e.contratoInicio) erros.contratoFim = 'O fim do contrato não pode ser antes do início.';
    if (vazio(e.dominio)) erros.dominio = 'Informe o domínio de e-mail permitido (ex.: example.com).';
    else if (!dominioValido(e.dominio)) erros.dominio = 'Domínio inválido (ex.: example.com, sem @).';
    else if (outras.some(o => o.dominio.toLowerCase() === e.dominio.trim().toLowerCase())) erros.dominio = 'Este domínio já pertence a outra empresa.';
    return erros;
  }

  // ---------- Usuário ----------
  function usuarioVazio(empresaId) {
    return { id: '', empresaId, nome: '', email: '', cargo: '', perfil: 'operador', municipios: [],
      status: 'convidado', doisFatores: false, ultimoAcesso: '', criadoPor: '', criadoEm: '', alteradoPor: '', alteradoEm: '' };
  }

  function validarUsuario(u, empresa, usuarios = []) {
    const erros = {};
    if (vazio(u.nome)) erros.nome = 'Informe o nome completo.';
    else if (u.nome.trim().length > 100) erros.nome = 'Use no máximo 100 caracteres.';
    if (vazio(u.email)) erros.email = 'Informe o e-mail corporativo.';
    else if (!emailValido(u.email)) erros.email = 'E-mail inválido.';
    else if (!emailNoDominio(u.email, empresa.dominio)) erros.email = `Só e-mails @${empresa.dominio} podem ser cadastrados nesta empresa.`;
    else if (usuarios.some(o => o.id !== u.id && o.email.toLowerCase() === u.email.trim().toLowerCase()))
      erros.email = 'Este e-mail já está cadastrado.';
    if (String(u.cargo ?? '').length > 80) erros.cargo = 'Use no máximo 80 caracteres.';
    if (!PERFIS_USUARIO.includes(u.perfil)) erros.perfil = 'Escolha o perfil.';
    const daEmpresa = new Set(empresa.municipios.map(m => m.codigo));
    if (!u.municipios.length) erros.municipios = 'Escolha pelo menos um município.';
    else if (u.municipios.some(c => !daEmpresa.has(c))) erros.municipios = 'Só é possível escolher municípios da empresa.';
    if (!['convidado', 'ativo', 'bloqueado'].includes(u.status)) erros.status = 'Escolha o status.';
    if (empresa.exige2Etapas && !u.doisFatores) erros.doisFatores = 'Esta empresa exige verificação em 2 etapas.';
    return erros;
  }

  // Situação mostrada na tela: empresa suspensa bloqueia todos os usuários dela
  function situacaoUsuario(u, empresa) {
    if (empresa.status === 'suspensa') return { codigo: 'bloqueado', texto: 'Bloqueado (empresa suspensa)' };
    return { convidado: { codigo: 'convidado', texto: 'Convidado' }, ativo: { codigo: 'ativo', texto: 'Ativo' },
      bloqueado: { codigo: 'bloqueado', texto: 'Bloqueado' } }[u.status];
  }

  const adminsAtivos = (usuarios, empresaId, excetoId) =>
    usuarios.filter(u => u.empresaId === empresaId && u.id !== excetoId && u.perfil === 'admin_empresa' && u.status !== 'bloqueado');

  // A mudança tira o último admin (não bloqueado) da empresa?
  function tiraUltimoAdmin(antes, depois, usuarios) {
    if (!antes || antes.perfil !== 'admin_empresa' || antes.status === 'bloqueado') return false;
    const continuaAdmin = depois && depois.perfil === 'admin_empresa' && depois.status !== 'bloqueado';
    return !continuaAdmin && adminsAtivos(usuarios, antes.empresaId, antes.id).length === 0;
  }

  // ---------- Sessão (simulada) e permissões ----------
  // sessao = { perfil, empresaId } (empresaId só para os perfis de empresa)
  function pode(sessao, acao, empresaId) {
    if (!sessao) return false;
    if (sessao.perfil === 'admin_farol') return true;
    if (sessao.perfil !== 'admin_empresa') return false;
    // Admin da empresa: só a própria empresa, e nunca a lista de empresas nem o cadastro delas
    if (['ver_empresas', 'criar_empresa', 'editar_empresa', 'suspender_empresa'].includes(acao)) return false;
    if (['ver_usuarios', 'editar_usuario', 'ver_configuracao', 'editar_configuracao', 'gerar_toml', 'ver_registro'].includes(acao))
      return acao === 'ver_registro' || empresaId === sessao.empresaId;
    return false;
  }

  // Telas do menu, na ordem
  function menu(sessao) {
    if (!sessao) return [];
    if (sessao.perfil === 'admin_farol') return [['empresas', 'Empresas'], ['registro', 'Registro de atividades']];
    if (sessao.perfil === 'admin_empresa') return [['usuarios', 'Usuários'], ['configuracao', 'Configuração'], ['registro', 'Registro de atividades']];
    return [];
  }

  function quem(sessao, estado) {
    if (sessao.perfil === 'admin_farol') return 'Admin do Norte';
    const e = estado.empresas.find(x => x.id === sessao.empresaId);
    return `${PERFIS[sessao.perfil]} · ${e ? e.nomeFantasia : '?'}`;
  }

  // ---------- Estado e operações (todas conferem a permissão e registram a atividade) ----------
  function criarEstado(demo) {
    const copia = JSON.parse(JSON.stringify(demo));
    return { empresas: copia.empresas, usuarios: copia.usuarios, registro: [], proximoId: 1, sessao: null };
  }
  const novoId = (estado, prefixo) => `${prefixo}-novo-${estado.proximoId++}`;
  const agoraIso = agora => (agora || new Date()).toISOString();

  function registrar(estado, acao, alvo, empresaId, agora) {
    estado.registro.push({ quando: agoraIso(agora), quem: quem(estado.sessao, estado), acao, alvo, empresaId: empresaId ?? null });
  }

  // Registro visível: o Admin do Norte vê tudo; o admin da empresa, só o da própria empresa
  function registroVisivel(estado) {
    const s = estado.sessao;
    if (!pode(s, 'ver_registro')) return [];
    return s.perfil === 'admin_farol' ? estado.registro.slice() : estado.registro.filter(r => r.empresaId === s.empresaId);
  }

  function entrar(estado, perfil, empresaId, agora) {
    if (!PERFIS[perfil]) return { ok: false, erro: 'Perfil desconhecido.' };
    if (perfil !== 'admin_farol' && !estado.empresas.some(e => e.id === empresaId)) return { ok: false, erro: 'Escolha a empresa.' };
    estado.sessao = { perfil, empresaId: perfil === 'admin_farol' ? null : empresaId };
    registrar(estado, 'entrou (simulado)', PERFIS[perfil], estado.sessao.empresaId, agora);
    return { ok: true };
  }

  function sair(estado) { estado.sessao = null; }

  const limparEmpresa = e => ({ ...e,
    razaoSocial: e.razaoSocial.trim(), nomeFantasia: e.nomeFantasia.trim(), cnpj: formatarCNPJ(e.cnpj),
    emailInstitucional: e.emailInstitucional.trim().toLowerCase(), telefone: e.telefone.trim(), site: e.site.trim(),
    gestorNome: e.gestorNome.trim(), gestorEmail: e.gestorEmail.trim().toLowerCase(),
    dpoNome: e.dpoNome.trim(), dpoEmail: e.dpoEmail.trim().toLowerCase(), dominio: e.dominio.trim().toLowerCase(),
    antecedenciaHoras: Number(e.antecedenciaHoras), motivoPadrao: String(e.motivoPadrao ?? '').trim(),
    municipios: e.municipios.map(m => ({ codigo: String(m.codigo).trim(), nome: m.nome.trim() })) });

  function salvarEmpresa(estado, dados, agora) {
    const nova = !dados.id;
    if (!pode(estado.sessao, nova ? 'criar_empresa' : 'editar_empresa', dados.id)) return { ok: false, erro: 'Sem permissão.' };
    const erros = validarEmpresa(dados, estado.empresas);
    if (Object.keys(erros).length) return { ok: false, erros };
    const quando = agoraIso(agora), autor = quem(estado.sessao, estado);
    const e = limparEmpresa(dados);
    if (nova) {
      Object.assign(e, { id: novoId(estado, 'emp'), criadoPor: autor, criadoEm: quando, alteradoPor: autor, alteradoEm: quando });
      estado.empresas.push(e);
    } else {
      const i = estado.empresas.findIndex(x => x.id === e.id);
      if (i < 0) return { ok: false, erro: 'Empresa não encontrada.' };
      Object.assign(e, { criadoPor: estado.empresas[i].criadoPor, criadoEm: estado.empresas[i].criadoEm, alteradoPor: autor, alteradoEm: quando });
      // Municípios que saíram da empresa saem também dos usuários
      const ficam = new Set(e.municipios.map(m => m.codigo));
      estado.usuarios.filter(u => u.empresaId === e.id).forEach(u => { u.municipios = u.municipios.filter(c => ficam.has(c)); });
      estado.empresas[i] = e;
    }
    registrar(estado, nova ? 'criou empresa' : 'alterou empresa', e.nomeFantasia, e.id, agora);
    return { ok: true, id: e.id };
  }

  function alternarEmpresa(estado, id, agora) {
    if (!pode(estado.sessao, 'suspender_empresa', id)) return { ok: false, erro: 'Sem permissão.' };
    const e = estado.empresas.find(x => x.id === id);
    if (!e) return { ok: false, erro: 'Empresa não encontrada.' };
    e.status = e.status === 'ativa' ? 'suspensa' : 'ativa';
    e.alteradoPor = quem(estado.sessao, estado); e.alteradoEm = agoraIso(agora);
    registrar(estado, e.status === 'suspensa' ? 'suspendeu empresa' : 'reativou empresa', e.nomeFantasia, e.id, agora);
    return { ok: true };
  }

  // Configuração (admin da empresa): só idioma, fuso, antecedência e motivo padrão
  const CAMPOS_CONFIGURACAO = ['idioma', 'fuso', 'antecedenciaHoras', 'motivoPadrao'];
  function salvarConfiguracao(estado, empresaId, dados, agora) {
    if (!pode(estado.sessao, 'editar_configuracao', empresaId)) return { ok: false, erro: 'Sem permissão.' };
    const atual = estado.empresas.find(x => x.id === empresaId);
    if (!atual) return { ok: false, erro: 'Empresa não encontrada.' };
    const candidata = { ...atual };
    CAMPOS_CONFIGURACAO.forEach(c => { candidata[c] = dados[c]; });
    const erros = Object.fromEntries(Object.entries(validarEmpresa(candidata, estado.empresas)).filter(([c]) => CAMPOS_CONFIGURACAO.includes(c)));
    if (Object.keys(erros).length) return { ok: false, erros };
    candidata.antecedenciaHoras = Number(candidata.antecedenciaHoras);
    candidata.motivoPadrao = String(candidata.motivoPadrao ?? '').trim();
    candidata.alteradoPor = quem(estado.sessao, estado); candidata.alteradoEm = agoraIso(agora);
    Object.assign(atual, candidata);
    registrar(estado, 'alterou configuração', atual.nomeFantasia, empresaId, agora);
    return { ok: true };
  }

  function salvarUsuario(estado, dados, agora) {
    const empresa = estado.empresas.find(x => x.id === dados.empresaId);
    if (!empresa) return { ok: false, erro: 'Empresa não encontrada.' };
    if (!pode(estado.sessao, 'editar_usuario', empresa.id)) return { ok: false, erro: 'Sem permissão.' };
    const antes = dados.id ? estado.usuarios.find(u => u.id === dados.id) : null;
    if (dados.id && (!antes || antes.empresaId !== empresa.id)) return { ok: false, erro: 'Usuário não encontrado nesta empresa.' };
    const erros = validarUsuario(dados, empresa, estado.usuarios);
    if (Object.keys(erros).length) return { ok: false, erros };
    if (tiraUltimoAdmin(antes, dados, estado.usuarios))
      return { ok: false, erros: { perfil: 'Este é o último admin da empresa: cadastre outro admin antes de mudar o perfil ou bloquear.' } };
    const quando = agoraIso(agora), autor = quem(estado.sessao, estado);
    const u = { ...dados, nome: dados.nome.trim(), email: dados.email.trim().toLowerCase(), cargo: String(dados.cargo ?? '').trim(),
      municipios: empresa.municipios.map(m => m.codigo).filter(c => dados.municipios.includes(c)) };
    if (!antes) {
      // "Convidar" não cria senha: na produção o usuário recebe um link e cria a própria senha
      Object.assign(u, { id: novoId(estado, 'usu'), status: 'convidado', ultimoAcesso: '', criadoPor: autor, criadoEm: quando, alteradoPor: autor, alteradoEm: quando });
      estado.usuarios.push(u);
      registrar(estado, 'convidou usuário (simulado)', `${u.nome} (${PERFIS[u.perfil]})`, empresa.id, agora);
    } else {
      Object.assign(u, { status: dados.status, ultimoAcesso: antes.ultimoAcesso, criadoPor: antes.criadoPor, criadoEm: antes.criadoEm, alteradoPor: autor, alteradoEm: quando });
      estado.usuarios[estado.usuarios.indexOf(antes)] = u;
      registrar(estado, 'alterou usuário', `${u.nome} (${PERFIS[u.perfil]})`, empresa.id, agora);
    }
    return { ok: true, id: u.id };
  }

  function alternarBloqueio(estado, id, agora) {
    const u = estado.usuarios.find(x => x.id === id);
    if (!u) return { ok: false, erro: 'Usuário não encontrado.' };
    if (!pode(estado.sessao, 'editar_usuario', u.empresaId)) return { ok: false, erro: 'Sem permissão.' };
    const depois = { ...u, status: u.status === 'bloqueado' ? 'ativo' : 'bloqueado' };
    if (tiraUltimoAdmin(u, depois, estado.usuarios))
      return { ok: false, erro: 'Este é o último admin da empresa: cadastre outro admin antes de bloquear.' };
    u.status = depois.status; u.alteradoPor = quem(estado.sessao, estado); u.alteradoEm = agoraIso(agora);
    registrar(estado, u.status === 'bloqueado' ? 'bloqueou usuário' : 'reativou usuário', u.nome, u.empresaId, agora);
    return { ok: true };
  }

  // ---------- Busca ----------
  const normalizar = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
  const confere = (termo, ...campos) => !normalizar(termo) || campos.some(c => normalizar(c).includes(normalizar(termo)));

  // ---------- Arquivo de configuração (.toml), no formato de distribuidoras/*.toml ----------
  // padroes: os valores de demonstração (distribuidoras/demo-leopoldina.toml) para o que o cadastro
  // ainda não tem (expediente, limites do aviso, perfis). Nunca leva usuários.
  // String básica do TOML: os escapes do JSON são compatíveis (sem surrogates soltos, que o TOML recusa)
  const str = s => JSON.stringify(String(s).toWellFormed());
  function valorToml(v) {
    if (typeof v === 'string') return str(v);
    if (typeof v === 'number') return Number.isFinite(v) ? String(v) : '0';
    if (typeof v === 'boolean') return String(v);
    if (Array.isArray(v)) return `[${v.map(valorToml).join(', ')}]`;
    return `{ ${Object.entries(v).map(([k, x]) => `${k} = ${valorToml(x)}`).join(', ')} }`;
  }
  const secao = (nome, obj) => [`[${nome}]`, ...Object.entries(obj).map(([k, v]) => `${k} = ${valorToml(v)}`), ''];
  const slug = s => normalizar(s).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'empresa';

  function nomeArquivoToml(empresa, municipio) { return `${slug(empresa.nomeFantasia)}-${slug(municipio.nome)}.toml`; }

  function gerarToml(empresa, municipio, padroes, agora) {
    const linhas = [
      `# Configuração gerada pela área administrativa do Norte (PROTÓTIPO) em ${agoraIso(agora).slice(0, 10)}.`,
      `# Empresa: ${str(empresa.nomeFantasia)} · município: ${str(municipio.nome)}/${empresa.uf}.`,
      '# Expediente, limites do aviso e perfis de sensibilidade vêm da demonstração (a confirmar com a empresa).',
      '# Este arquivo não contém usuários nem dados pessoais.',
      '',
      ...secao('distribuidora', {
        nome: empresa.nomeFantasia,
        assinatura_aviso_atual: empresa.nomeFantasia,
        telefone: empresa.telefone,
        municipio: municipio.nome,
        uf: empresa.uf,
        codigo_ibge: municipio.codigo,
        idioma_padrao: empresa.idioma,
      }),
    ];
    // Ainda não usados pelo pipeline: ficam como comentário, para não mudar o formato do arquivo
    linhas.splice(linhas.length - 1, 0,
      `# fuso_horario = ${str(empresa.fuso)}            (ainda não usado pelo pipeline)`,
      `# motivo_padrao = ${str(empresa.motivoPadrao)}   (ainda não usado pelo pipeline)`);
    linhas.push(...secao('regulatorio', { ...padroes.regulatorio, prazo_legal_horas: Number(empresa.antecedenciaHoras) }));
    for (const s of ['expediente', 'aviso', 'obra', 'janela']) linhas.push(...secao(s, padroes[s]));
    for (const [nome, p] of Object.entries(padroes.perfis)) {
      linhas.push(`[perfis.${nome}]`, `singular = ${str(p.singular)}`, `plural = ${str(p.plural)}`, `padrao = ${valorToml(p.padrao)}`);
      linhas.push(p.periodos.length ? `periodos = [\n${p.periodos.map(q => `  ${valorToml(q)},`).join('\n')}\n]` : 'periodos = []', '');
    }
    return linhas.join('\n');
  }

  // Gera o arquivo de um município da empresa (confere a permissão e registra)
  function gerarConfiguracao(estado, empresaId, codigo, padroes, agora) {
    if (!pode(estado.sessao, 'gerar_toml', empresaId)) return { ok: false, erro: 'Sem permissão.' };
    const e = estado.empresas.find(x => x.id === empresaId);
    const m = e && e.municipios.find(x => x.codigo === codigo);
    if (!m) return { ok: false, erro: 'Município não encontrado nesta empresa.' };
    const nome = nomeArquivoToml(e, m);
    registrar(estado, 'gerou arquivo de configuração', `${e.nomeFantasia} · ${m.nome} (${nome})`, e.id, agora);
    return { ok: true, nome, texto: gerarToml(e, m, padroes, agora) };
  }

  // ---------- Registro em texto ----------
  function registroTexto(entradas) {
    const cab = ['Norte · Registro de atividades (PROTÓTIPO: dados fictícios, só na memória do navegador)', ''];
    return cab.concat(entradas.map(r => `${r.quando}\t${r.quem}\t${r.acao}\t${r.alvo}`)).join('\n') + '\n';
  }

  return {
    PERFIS, PERFIS_USUARIO, TIPOS_EMPRESA, IDIOMAS, FUSOS, UFS, PRAZO_LEGAL_MIN_HORAS, CAMPOS_CONFIGURACAO,
    cnpjValido, formatarCNPJ, normalizarCNPJ, ibgeValido, dominioValido, emailValido, emailNoDominio, telefoneValido,
    empresaVazia, validarEmpresa, usuarioVazio, validarUsuario, situacaoUsuario, tiraUltimoAdmin,
    pode, menu, quem, criarEstado, entrar, sair, registroVisivel,
    salvarEmpresa, alternarEmpresa, salvarConfiguracao, salvarUsuario, alternarBloqueio,
    confere, gerarToml, nomeArquivoToml, gerarConfiguracao, registroTexto,
  };
})();
</script>
<script>
'use strict';
const D = JSON.parse(document.getElementById('dados').textContent);
const M = Modelo;

// =====================================================================================
// MODEL: as regras e os dados (empresas, usuários, sessão e registro) estão em Modelo
// (admin_modelo.js, embutido acima). Aqui fica só o estado da tela. Tudo na memória:
// recarregar a página volta aos dados de demonstração. Nada fica guardado no navegador
// (nem em localStorage, nem em sessionStorage), nem mesmo o tema.
// =====================================================================================
const estado = M.criarEstado(D.demo);
estado.ui = {
  rota: { tela: 'entrar' },
  tema: 'auto',            // auto (segue o sistema), claro ou escuro
  busca: '',
  rascunho: null,          // cópia do formulário em edição
  tocados: new Set(),      // campos já editados (a mensagem de erro só aparece depois)
  tentouSalvar: false,
  erros: {},
  aviso: null,             // { tipo: 'ok' | 'erro', linhas: [...] }
  entrada: { perfil: 'admin_farol', empresaId: D.demo.empresas[0]?.id ?? '' },
};
const TEMAS = ['auto', 'claro', 'escuro'];
const ROTULO_TEMA = { auto: 'Tema: automático', claro: 'Tema: claro', escuro: 'Tema: escuro' };

function lerRota(hash) {
  const p = String(hash || '').replace(/^#\/?/, '').split('/').filter(Boolean).map(decodeURIComponent);
  switch (p[0]) {
    case 'empresas': return { tela: 'empresas' };
    case 'empresa': return { tela: 'empresa', id: p[1] === 'nova' ? null : p[1] };
    case 'usuarios': return { tela: 'usuarios', empresaId: p[1] };
    case 'usuario': return { tela: 'usuario', empresaId: p[1], id: p[2] === 'novo' ? null : p[2] };
    case 'configuracao': return { tela: 'configuracao', empresaId: p[1] };
    case 'registro': return { tela: 'registro' };
    case 'sem-acesso': return { tela: 'semAcesso' };
    default: return { tela: 'entrar' };
  }
}

// A rota é permitida para a sessão atual?
function rotaPermitida(r, s) {
  if (r.tela === 'entrar') return true;
  if (!s) return false;
  switch (r.tela) {
    case 'empresas': return M.pode(s, 'ver_empresas');

// =====================================================================================
// VIEW: desenha a partir do estado, sem mudar o estado. Todo texto entra por textContent
// ou value (nunca innerHTML), então um nome como "<img src=x onerror=...>" aparece como texto.
// =====================================================================================
const $ = id => document.getElementById(id);

// Cria um elemento: props com 'class', atributos, propriedades (value, checked, disabled) e filhos
function h(tag, props = {}, ...filhos) {
  const el = document.createElement(tag);
  let valor;
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'value') valor = v;
    else if (k === 'checked' || k === 'disabled' || k === 'readOnly' || k === 'open' || k === 'selected') el[k] = true;
    else el.setAttribute(k, v === true ? '' : String(v));
  }
  for (const f of filhos.flat(Infinity)) if (f != null && f !== false) el.append(f instanceof Node ? f : String(f));
  if (valor !== undefined) el.value = valor;
  return el;
}

function desenharTema() {

  if (t === 'auto') delete r.dataset.theme; else r.dataset.theme = t === 'escuro' ? 'dark' : 'light';
  $('btnTema').textContent = ROTULO_TEMA[t];
  $('btnTema').setAttribute('aria-label', ROTULO_TEMA[t]);

function desenharCabecalho() {
  const s = estado.sessao;
  $('sessao').textContent = s ? `Entrou como ${M.quem(s, estado)} (simulado)` : '';
  $('btnTrocar').hidden = !s;
  const itens = M.menu(s);
  $('menu').hidden = !itens.length;

    const marcado = atual === tela || (tela === 'empresas' && atual === 'empresa') || (tela === 'usuarios' && atual === 'usuario');
    return h('li', {}, h('a', { href: alvo, 'aria-current': marcado ? 'page' : null }, rotulo));
  }));
}

// ---------- Campos de formulário ----------
function campo(nome, rotulo, controle, { obrig = false, ajuda = '', largo = false } = {}) {
  controle.id = `f-${nome}`;
  controle.setAttribute('name', nome);
  controle.setAttribute('aria-describedby', `erro-${nome}${ajuda ? ` ajuda-${nome}` : ''}`);
  if (obrig) controle.setAttribute('aria-required', 'true');
  return h('div', { class: `campo${largo ? ' largo' : ''}` },
    h('label', { for: controle.id }, rotulo, obrig ? h('span', { class: 'obrig', 'aria-hidden': 'true' }, ' *') : null),
    controle,
    ajuda ? h('p', { class: 'ajuda', id: `ajuda-${nome}` }, ajuda) : null,
    h('p', { class: 'erro-campo', id: `erro-${nome}`, 'data-erro': nome }));
}
const entrada = (tipo, valor, extra = {}) => h('input', { type: tipo, value: valor ?? '', autocomplete: 'off', ...extra });
const selecao = (opcoes, valor, extra = {}) =>
  h('select', { value: valor, ...extra }, Object.entries(opcoes).map(([v, t]) => h('option', { value: v, selected: v === valor }, t)));
const marcavel = (nome, valor, rotulo, marcado, extra = {}) =>
  h('label', { class: 'opcao' }, h('input', { type: 'checkbox', name: nome, value: valor, checked: marcado, ...extra }),
    h('span', { class: 'caixa', 'aria-hidden': 'true' }), h('span', {}, rotulo));

// Mostra as mensagens de erro (só nos campos já tocados, ou em todos depois de tentar salvar)
function atualizarErros() {
  const u = estado.ui, form = document.querySelector('form[data-form]');
  if (!form) return;
  form.querySelectorAll('[data-erro]').forEach(p => {
    const nome = p.dataset.erro;
    const msg = (u.tentouSalvar || u.tocados.has(nome) || u.tocados.has(nome.replace(/\d+$/, ''))) ? (u.erros[nome] || '') : '';
    p.textContent = msg;
    const ctl = form.querySelector(`#f-${CSS.escape(nome)}`);
    if (ctl) ctl.setAttribute('aria-invalid', msg ? 'true' : 'false');
  });
  form.querySelectorAll('details.grupo').forEach(g => {
    const n = u.tentouSalvar ? [...g.querySelectorAll('[data-erro]')].filter(p => u.erros[p.dataset.erro]).length : 0;
    g.querySelector('.contagem').textContent = n ? `${n} ${n === 1 ? 'campo para corrigir' : 'campos para corrigir'}` : '';
    if (n) g.open = true;
  });
}

        campo('cargo', 'Cargo ou setor', entrada('text', r.cargo, { maxlength: '80' }))),
      grupo('Acesso', true,
        campo('perfil', 'Perfil', selecao(perfis, r.perfil), { obrig: true, ajuda: 'Admin da empresa cuida dos usuários; Operador usa o mapa; Consulta só vê.' }),
        h('div', { class: 'campo largo' },
          h('span', { class: 'rotulo', id: 'rot-mun' }, 'Municípios que pode operar', h('span', { class: 'obrig', 'aria-hidden': 'true' }, ' *')),
          h('div', { class: 'opcoes', role: 'group', 'aria-labelledby': 'rot-mun' },
            empresa.municipios.map(m => marcavel('municipios', m.codigo, m.nome, r.municipios.includes(m.codigo)))),
          h('p', { class: 'erro-campo', id: 'erro-municipios', 'data-erro': 'municipios' })),
        novo ? h('div', { class: 'campo' }, h('span', { class: 'rotulo' }, 'Status'), h('p', { class: 'ajuda' }, 'Convidado (até o primeiro acesso).'))
          : campo('status', 'Status', selecao({ convidado: 'Convidado', ativo: 'Ativo', bloqueado: 'Bloqueado' }, r.status), { obrig: true }),
        h('div', { class: 'campo' },
          marcavel('doisFatores', 'sim', 'Verificação em 2 etapas', r.doisFatores, { id: 'f-doisFatores', disabled: empresa.exige2Etapas }),
          empresa.exige2Etapas ? h('p', { class: 'ajuda' }, 'Obrigatória nesta empresa.') : null,
          h('p', { class: 'erro-campo', id: 'erro-doisFatores', 'data-erro': 'doisFatores' }))),
      h('div', { class: 'linha-botoes' },
        h('button', { type: 'submit', class: 'botao principal' }, novo ? 'Enviar convite (simulado)' : 'Salvar alterações'),
        h('a', { class: 'botao', href: `#/usuarios/${encodeURIComponent(empresa.id)}` }, 'Voltar'))));
}

function telaConfiguracao() {
  const r = estado.ui.rascunho, empresa = empresaPorId(r.id);
  return h('section', { 'aria-labelledby': 't-config' },
    h('h1', { id: 't-config', tabindex: '-1' }, `Configuração · ${empresa.nomeFantasia}`),
    h('p', { class: 'apoio' }, 'Os dados cadastrais (CNPJ, contato, municípios, domínio) são mantidos pelo Admin do Norte.'),
    caixaAviso(),
    h('div', { class: 'cartao' }, h('dl', { class: 'resumo' },
      h('dt', {}, 'CNPJ'), h('dd', { class: 'mono' }, empresa.cnpj),
      h('dt', {}, 'Municípios'), h('dd', {}, empresa.municipios.map(m => `${m.nome} (${m.codigo})`).join(', ')),
      h('dt', {}, 'Domínio permitido'), h('dd', {}, empresa.dominio),
      h('dt', {}, '2 etapas'), h('dd', {}, empresa.exige2Etapas ? 'Obrigatória' : 'Opcional'))),
    h('form', { 'data-form': 'configuracao', novalidate: true },
      grupo('Aviso', true,
        campo('idioma', 'Idioma do aviso', selecao(M.IDIOMAS, r.idioma), { obrig: true }),
        campo('fuso', 'Fuso horário', selecao(Object.fromEntries(M.FUSOS.map(f => [f, f])), r.fuso), { obrig: true }),
        campo('antecedenciaHoras', 'Antecedência mínima (horas)', entrada('number', r.antecedenciaHoras, { min: String(M.PRAZO_LEGAL_MIN_HORAS), step: '1' }),
          { obrig: true, ajuda: `Não pode ser menor que o prazo legal (${M.PRAZO_LEGAL_MIN_HORAS} h).` }),
        campo('motivoPadrao', 'Motivo padrão', entrada('text', r.motivoPadrao, { maxlength: '120' }))),
      h('div', { class: 'linha-botoes' }, h('button', { type: 'submit', class: 'botao principal' }, 'Salvar configuração'))),
    botoesToml(empresa));
}

function telaRegistro() {
  const lista = M.registroVisivel(estado).slice().reverse();
  return h('section', { 'aria-labelledby': 't-registro' },
    h('h1', { id: 't-registro', tabindex: '-1' }, 'Registro de atividades'),
    h('p', { class: 'apoio' }, 'Só desta sessão, na memória do navegador. Na produção, o registro é guardado no servidor e não pode ser alterado.'),
    h('div', { class: 'linha-botoes', style: null }, h('button', { type: 'button', class: 'botao', 'data-acao': 'baixar-registro', disabled: !lista.length }, 'Baixar registro (.txt)')),
    h('div', { class: 'tabela-caixa' }, h('table', {},
      h('thead', {}, h('tr', {}, ['Data e hora', 'Quem', 'Ação', 'Alvo'].map(t => h('th', { scope: 'col' }, t)))),
      h('tbody', {}, lista.length ? lista.map(r => h('tr', {},
        h('td', { 'data-rotulo': 'Data e hora' }, dataHora(r.quando)),
        h('td', { 'data-rotulo': 'Quem' }, r.quem),
        h('td', { 'data-rotulo': 'Ação' }, r.acao),
        h('td', { 'data-rotulo': 'Alvo' }, r.alvo)))
        : [h('tr', {}, h('td', { colspan: '4', class: 'vazio' }, 'Nenhuma atividade ainda.'))]))));
}

const TELAS = { entrar: telaEntrar, empresas: telaEmpresas, empresa: telaEmpresa, usuarios: telaUsuarios,
  usuario: telaUsuario, configuracao: telaConfiguracao, registro: telaRegistro, semAcesso: telaSemAcesso };

function desenhar({ focar = false } = {}) {
  desenharTema();
  desenharCabecalho();
  const ui = estado.ui;
  $('conteudo').replaceChildren(TELAS[ui.permitida ? ui.rota.tela : 'semAcesso']());
  atualizarErros();
  if (focar) ($('conteudo').querySelector('h1') || $('conteudo')).focus();
}

function atualizarLista() {
  const r = estado.ui.rota;
  const corpo = $('lista');
  if (!corpo) return;
  corpo.replaceChildren(...(r.tela === 'empresas' ? linhasEmpresas() : linhasUsuarios(empresaPorId(r.empresaId))));
}

function oferecerDownload(nome, texto, tipo) {
  const url = URL.createObjectURL(new Blob([texto], { type: tipo }));
  const a = document.createElement('a');
  a.href = url; a.download = nome;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// =====================================================================================
// CONTROLLER: responde à navegação (#/...), aos cliques e à digitação. Atualiza o estado
// pelo Modelo e pede à View para redesenhar. Uma rota sem permissão mostra "Sem acesso".
// =====================================================================================
function rascunhoDaRota(r) {
  if (r.tela === 'empresa') return structuredClone(r.id ? empresaPorId(r.id) : M.empresaVazia());
  if (r.tela === 'usuario') {
    if (r.id) return structuredClone(estado.usuarios.find(u => u.id === r.id && u.empresaId === r.empresaId) ?? null);
    const novo = M.usuarioVazio(r.empresaId), e = empresaPorId(r.empresaId);
    novo.doisFatores = !!e?.exige2Etapas;
    if (e && e.municipios.length === 1) novo.municipios = [e.municipios[0].codigo];
    return novo;
  }
  if (r.tela === 'configuracao') {
    const e = empresaPorId(r.empresaId);
    return e ? Object.fromEntries(['id', ...M.CAMPOS_CONFIGURACAO].map(c => [c, e[c]])) : null;
  }
  return null;
}

function validarRascunho() {
  const ui = estado.ui, r = ui.rascunho, t = ui.rota.tela;
  if (t === 'empresa') ui.erros = M.validarEmpresa(r, estado.empresas);
  else if (t === 'usuario') ui.erros = M.validarUsuario(r, empresaPorId(r.empresaId), estado.usuarios);
  else if (t === 'configuracao') {
    const e = { ...empresaPorId(r.id), ...r };
    ui.erros = Object.fromEntries(Object.entries(M.validarEmpresa(e, estado.empresas)).filter(([c]) => M.CAMPOS_CONFIGURACAO.includes(c)));
  } else ui.erros = {};
}

function aoMudarRota({ manterAviso = false } = {}) {
  const ui = estado.ui;
  let rota = lerRota(location.hash);
  if (!estado.sessao && rota.tela !== 'entrar') rota = { tela: 'entrar' };
  const mudouTela = JSON.stringify(rota) !== JSON.stringify(ui.rota);
  ui.rota = rota;
  ui.permitida = rotaPermitida(rota, estado.sessao);
  // Rota permitida mas com registro inexistente (empresa ou usuário de outra empresa): também "Sem acesso"
  const precisaEmpresa = ['usuarios', 'usuario', 'configuracao'].includes(rota.tela) || (rota.tela === 'empresa' && rota.id);
  if (ui.permitida && precisaEmpresa && !empresaPorId(rota.empresaId ?? rota.id)) ui.permitida = false;
  ui.rascunho = ui.permitida ? rascunhoDaRota(rota) : null;
  if (ui.permitida && ['empresa', 'usuario', 'configuracao'].includes(rota.tela) && !ui.rascunho) ui.permitida = false;
  if (mudouTela) { ui.busca = ''; ui.tocados = new Set(); ui.tentouSalvar = false; if (!manterAviso) ui.aviso = null; }
  if (ui.rascunho) validarRascunho();
  desenhar({ focar: mudouTela });
}

function irPara(hash, aviso) {
  estado.ui.aviso = aviso || null;
  if (location.hash === hash) aoMudarRota({ manterAviso: true });
  else { estado.ui.proximoAviso = aviso || null; location.hash = hash; }
}

function telaInicial(s) {
  if (s.perfil === 'admin_farol') return '#/empresas';
  if (s.perfil === 'admin_empresa') return `#/usuarios/${encodeURIComponent(s.empresaId)}`;
  return '#/sem-acesso';
}

// Digitação nos formulários: atualiza o rascunho e as mensagens, sem redesenhar (o foco fica)
document.addEventListener('input', ev => {
  const el = ev.target, form = el.closest('form[data-form]');
  const ui = estado.ui;
  if (el.name === 'busca') { ui.busca = el.value; atualizarLista(); return; }
  if (!form) return;
  if (form.dataset.form === 'entrar') {
    if (el.name === 'perfil') { ui.entrada.perfil = el.value; desenhar(); document.querySelector(`input[name="perfil"][value="${el.value}"]`)?.focus(); }
    else if (el.name === 'empresaId') ui.entrada.empresaId = el.value;
    return;
  }
  const r = ui.rascunho;
  if (!r) return;
  if (el.name === 'municipio-codigo' || el.name === 'municipio-nome') {
    const i = Number(el.dataset.i);
    r.municipios[i][el.name === 'municipio-codigo' ? 'codigo' : 'nome'] = el.value;
    ui.tocados.add(`municipio${i}`);
  } else if (el.name === 'municipios') {
    r.municipios = [...form.querySelectorAll('input[name="municipios"]:checked')].map(x => x.value);
    ui.tocados.add('municipios');
  } else if (el.type === 'checkbox') {
    r[el.name] = el.checked; ui.tocados.add(el.name);
  } else if (el.name in r) {
    r[el.name] = el.value; ui.tocados.add(el.name);
    if (el.name === 'uf') r.municipios.forEach((_, i) => ui.tocados.add(`municipio${i}`));
  }
  validarRascunho();
  atualizarErros();
});
document.addEventListener('change', ev => {
  // selects e checkboxes já disparam "input"; datas em alguns navegadores só disparam "change"
  if (ev.target.type === 'date') ev.target.dispatchEvent(new Event('input', { bubbles: true }));
});

document.addEventListener('submit', ev => {
  ev.preventDefault();
  const form = ev.target, ui = estado.ui, tipo = form.dataset.form;
  if (tipo === 'entrar') {
    const r = M.entrar(estado, ui.entrada.perfil, ui.entrada.empresaId);
    if (!r.ok) { ui.aviso = { tipo: 'erro', linhas: [r.erro] }; desenhar(); return; }
    irPara(telaInicial(estado.sessao));
    return;
  }
  ui.tentouSalvar = true;
  let r;
  if (tipo === 'empresa') r = M.salvarEmpresa(estado, ui.rascunho);
  else if (tipo === 'usuario') r = M.salvarUsuario(estado, ui.rascunho);
  else if (tipo === 'configuracao') r = M.salvarConfiguracao(estado, ui.rascunho.id, ui.rascunho);
  if (!r.ok) {
    if (r.erros) ui.erros = { ...ui.erros, ...r.erros };
    const n = Object.keys(r.erros || {}).length;
    ui.aviso = { tipo: 'erro', linhas: [r.erro || `Corrija ${n === 1 ? 'o campo marcado' : `os ${n} campos marcados`} para salvar.`] };
    desenhar();
    ($('aviso') || form).focus?.();
    form.querySelector('[aria-invalid="true"]')?.focus();
    return;
  }
  if (tipo === 'empresa') {
    irPara(`#/empresa/${encodeURIComponent(r.id)}`, { tipo: 'ok', linhas: [ui.rascunho.id ? 'Alterações salvas.' : 'Empresa cadastrada. Agora convide o primeiro admin da empresa.'] });
  } else if (tipo === 'usuario') {
    const u = estado.usuarios.find(x => x.id === r.id), novo = !ui.rascunho.id;
    irPara(`#/usuarios/${encodeURIComponent(u.empresaId)}`, { tipo: 'ok', linhas: novo
      ? [`Convite simulado para ${u.email}.`, 'Na produção, essa pessoa receberia um link para criar a própria senha, guardada só como hash. Nenhuma senha foi criada aqui.']
      : ['Alterações salvas.'] });
  } else {
    ui.aviso = { tipo: 'ok', linhas: ['Configuração salva.'] };
    aoMudarRota({ manterAviso: true });
  }
});

document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-acao]');
  if (!b) return;
  const ui = estado.ui, acao = b.dataset.acao;
  if (acao === 'tema') { ui.tema = TEMAS[(TEMAS.indexOf(ui.tema) + 1) % TEMAS.length]; desenharTema(); return; }
  if (acao === 'sair') { M.sair(estado); ui.aviso = null; irPara('#/entrar'); return; }
  if (acao === 'adicionar-municipio') {
    ui.rascunho.municipios.push({ codigo: '', nome: '' }); validarRascunho(); desenhar();
    document.getElementById(`f-municipio${ui.rascunho.municipios.length - 1}`)?.focus();
    return;
  }
  if (acao === 'remover-municipio') {
    ui.rascunho.municipios.splice(Number(b.dataset.i), 1); ui.tocados.add('municipios'); validarRascunho(); desenhar();
    return;
  }
  let r;
  if (acao === 'alternar-empresa') r = M.alternarEmpresa(estado, b.dataset.id);
  else if (acao === 'alternar-bloqueio') r = M.alternarBloqueio(estado, b.dataset.id);
  else if (acao === 'gerar-toml') {
    r = M.gerarConfiguracao(estado, b.dataset.empresa, b.dataset.municipio, D.padroesToml);
    if (r.ok) { oferecerDownload(r.nome, r.texto, 'application/toml;charset=utf-8'); ui.aviso = { tipo: 'ok', linhas: [`Arquivo ${r.nome} gerado.`] }; }
  } else if (acao === 'baixar-registro') {
    oferecerDownload('farol-registro-de-atividades.txt', M.registroTexto(M.registroVisivel(estado)), 'text/plain;charset=utf-8');
    return;
  } else return;
  if (!r.ok) ui.aviso = { tipo: 'erro', linhas: [r.erro] };
  else if (acao !== 'gerar-toml') ui.aviso = null;
  const foco = b.id || null;
  desenhar();
  if (foco) $(foco)?.focus();
});

window.addEventListener('hashchange', () => {
  const aviso = estado.ui.proximoAviso;
  estado.ui.proximoAviso = null;
  if (aviso) estado.ui.aviso = aviso;
  aoMudarRota({ manterAviso: !!aviso });
});

// Abertura: sempre começa na entrada simulada
if (location.hash && location.hash !== '#/entrar') history.replaceState(null, '', '#/entrar');
aoMudarRota();
</script>
